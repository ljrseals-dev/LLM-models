name: CI

on:
  push:
    branches: [main, "repair/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/onnx/requirements.txt

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install check-jsonschema -r tools/onnx/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check shell syntax
        run: |
          bash -n cli/llm-models lib/common.sh scripts/smoke-test.sh tools/onnx/test_cli_prepare.sh
          shellcheck -x cli/llm-models lib/common.sh scripts/smoke-test.sh tools/onnx/test_cli_prepare.sh

      - name: Test numeric quantized fallback transforms
        run: "$RUNNER_TEMP/venv/bin/python tools/onnx/test_fallback.py"

      - name: Test independent numeric fallback oracles
        run: |
          "$RUNNER_TEMP/venv/bin/python" tools/onnx/test_fallback_runtime.py
          "$RUNNER_TEMP/venv/bin/python" tools/onnx/test_fallback_runtime_malformed.py

      - name: Test ONNX-to-Cmajor patch generation and provenance
        run: "$RUNNER_TEMP/venv/bin/python tools/onnx/test_prepare.py"

      - name: Test CLI ONNX preparation lifecycle
        run: bash tools/onnx/test_cli_prepare.sh

      - name: Run isolated registry regression tests
        run: bash scripts/smoke-test.sh
