name: CI

on:
  push:
    branches: [main, "repair/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install check-jsonschema
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check shell syntax
        run: |
          bash -n cli/llm-models lib/common.sh scripts/smoke-test.sh
          shellcheck cli/llm-models lib/common.sh scripts/smoke-test.sh

      - name: Run isolated regression tests
        run: bash scripts/smoke-test.sh
